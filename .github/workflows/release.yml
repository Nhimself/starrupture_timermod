name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v1.4.0)'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          submodules: recursive
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: ${{ env.RELEASE_TAG }}

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v3

      - name: Build Client Release
        run: |
          msbuild "StarRupture-TimerMod.sln" `
            /p:Configuration="Client Release" `
            /p:Platform=x64 `
            /p:ModLoaderBuildTag="${{ env.RELEASE_TAG }}" `
            /m `
            /v:minimal

      - name: Generate release assets
        id: assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FALLBACK_MODLOADER_VERSION: ${{ vars.MODLOADER_VERSION }}
        run: |
          $tag    = "${{ env.RELEASE_TAG }}"
          $repo   = "${{ github.repository }}"
          $ws     = $env:GITHUB_WORKSPACE
          $name   = "TimerMod"
          $varLow = "client"

          # Read interface version range from local plugin_interface.h
          $header   = Get-Content "$ws\include\plugin_interface.h" -Raw
          $matchMin = [regex]::Match($header, '#define\s+PLUGIN_INTERFACE_VERSION_MIN\s+(\d+)')
          $matchMax = [regex]::Match($header, '#define\s+PLUGIN_INTERFACE_VERSION_MAX\s+(\d+)')
          if (-not $matchMin.Success) { throw "PLUGIN_INTERFACE_VERSION_MIN not found in plugin_interface.h" }
          if (-not $matchMax.Success) { throw "PLUGIN_INTERFACE_VERSION_MAX not found in plugin_interface.h" }
          $ifaceMin = [int]$matchMin.Groups[1].Value
          $ifaceMax = [int]$matchMax.Groups[1].Value
          Write-Host "Interface version range: [$ifaceMin, $ifaceMax]"

          # Resolve the AlienX ModLoader release that pins this exact Game SDK commit.
          # Both this repo and the ModLoader pin StarRupture-Game-SDK as a submodule at
          # path "StarRupture SDK", so we match our pinned commit against each ModLoader
          # release's submodule pointer. The match is used only when it is unambiguous
          # (exactly one release); otherwise we fall back to the MODLOADER_VERSION repo
          # variable so the Nexus description can never go blank or wrong silently.
          $sdkCommit = (& git -C "StarRupture SDK" rev-parse HEAD).Trim()
          Write-Host "Pinned Game SDK commit: $sdkCommit"

          $mlRepo   = "AlienXAXS/StarRupture-ModLoader"
          $sdkPath  = "StarRupture%20SDK"
          $resolved = $null

          $relJson = gh api "repos/$mlRepo/releases?per_page=100" 2>$null
          if ($LASTEXITCODE -eq 0) {
            $releases = $relJson | ConvertFrom-Json
            $hits = @()
            foreach ($rel in $releases) {
              $tag = $rel.tag_name
              # contents API returns type=submodule + sha (the pinned commit) for a gitlink path
              $entryJson = gh api "repos/$mlRepo/contents/${sdkPath}?ref=$tag" 2>$null
              if ($LASTEXITCODE -ne 0) { continue }
              $entry = $entryJson | ConvertFrom-Json
              if ($entry.type -eq "submodule" -and $entry.sha -eq $sdkCommit) {
                $hits += $tag
              }
            }
            $hits = @($hits | Select-Object -Unique)
            if ($hits.Count -eq 1) {
              $resolved = $hits[0]
              Write-Host "Matched ModLoader release by SDK pointer: $resolved"
            } elseif ($hits.Count -gt 1) {
              Write-Host "Ambiguous: multiple ModLoader releases pin $sdkCommit ($($hits -join ', ')). Falling back."
            } else {
              Write-Host "No ModLoader release pins $sdkCommit. Falling back."
            }
          } else {
            Write-Host "ModLoader releases lookup failed. Falling back."
          }

          if (-not $resolved) {
            $resolved = "$env:FALLBACK_MODLOADER_VERSION"
            Write-Host "Using fallback MODLOADER_VERSION: $resolved"
          }
          Write-Host "Resolved ModLoader version: $resolved"
          echo "MODLOADER_VERSION=$resolved" >> $env:GITHUB_OUTPUT

          # Standalone DLL
          $dllSrc = "$ws\bin\x64\Client Release\plugins\$name.dll"
          Copy-Item $dllSrc "$ws\$name-Client.dll"

          # Per-plugin update manifest
          $manifest = [ordered]@{
            plugin_name           = $name
            version               = $tag
            interface_version_min = $ifaceMin
            interface_version_max = $ifaceMax
            download_url          = "https://github.com/$repo/releases/download/$tag/$name-Client.dll"
          }
          $manifest | ConvertTo-Json -Depth 1 | Out-File "$ws\$name-$varLow-manifest.json" -Encoding utf8NoBOM
          Write-Host "Manifest:"
          Get-Content "$ws\$name-$varLow-manifest.json"

          # Sidecar JSON (goes inside ZIP alongside the DLL)
          $sidecar = [ordered]@{
            manifest_url = "https://github.com/$repo/releases/latest/download/$name-$varLow-manifest.json"
          }

          # ZIP: Plugins\Name.dll + Plugins\Name.json
          $staging = "$ws\staging\Plugins"
          New-Item -ItemType Directory -Force $staging | Out-Null
          Copy-Item $dllSrc "$staging\$name.dll"
          $sidecar | ConvertTo-Json -Depth 1 | Out-File "$staging\$name.json" -Encoding utf8NoBOM

          $zipPath = "$ws\$name-Client-$tag.zip"
          Compress-Archive -Path "$ws\staging\*" -DestinationPath $zipPath
          Write-Host "Created ZIP: $name-Client-$tag.zip"
          echo "ZIP_PATH=$zipPath" >> $env:GITHUB_OUTPUT
          echo "NEXUS_VERSION=$($tag.TrimStart('v'))" >> $env:GITHUB_OUTPUT

      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag  = "${{ env.RELEASE_TAG }}"
          $ws   = $env:GITHUB_WORKSPACE
          $name = "TimerMod"

          # Reference the exact artifacts the assets step produced (ZIP_PATH is exported
          # there) rather than reconstructing filenames from $tag, so the two steps can
          # never disagree on the name.
          $assets = @(
            "$ws\$name-Client.dll",
            "$ws\$name-client-manifest.json",
            "${{ steps.assets.outputs.ZIP_PATH }}"
          )

          gh release create $tag @assets `
            --title "TimerMod $tag" `
            --generate-notes

      - name: Upload to Nexus Mods
        uses: Nexus-Mods/upload-action@main
        with:
          api_key: ${{ secrets.NEXUSMODS_API_KEY }}
          file_group_id: ${{ vars.NEXUSMODS_FILE_GROUP_ID }}
          filename: ${{ steps.assets.outputs.ZIP_PATH }}
          display_name: "TimerMod ${{ env.RELEASE_TAG }}"
          description: "Supporting release AlienX ModLoader ${{ steps.assets.outputs.MODLOADER_VERSION }}."
          version: ${{ steps.assets.outputs.NEXUS_VERSION }}
